# tz-data.service reads TIMEZONE from /storage/.cache/timezone, which
# usercache-setup puts there. Upstream orders both only After=
# systemd-tmpfiles-setup.service, so on a FIRST boot - the one where
# /storage/.cache/timezone does not exist yet - which runs first is a race,
# and losing it means a boot in UTC. Nothing else in either unit orders them.
[Unit]
After=usercache.service
