# Kodi quits on every remote Stop (player.coreelec:restart_on_stop) and
# systemd restarts it. Where the Symphony GUI runs on this box its frames are
# shown by Kodi's Symphony layer, so the screen is black for as long as Kodi
# is gone; upstream's RestartSec=2s is most of that gap (measured ~3.4 s vs
# ~1.5 s with 100ms, theater mach/gui/PLAN_gui_on_am9.md).
[Service]
RestartSec=100ms
