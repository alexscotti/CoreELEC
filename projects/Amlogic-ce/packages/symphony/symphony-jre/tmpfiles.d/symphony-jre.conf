# CoreELEC patches libbluray to pass -Djava.io.tmpdir=<this path> to the BD-J
# JVM (the string is compiled into libbluray.so), so it has to exist and be
# writable whether or not anything called tools.jre.zulu is installed. It used
# to exist because the JRE add-on lived under /storage and the tarball carried
# its addon_data directory; the JRE is in the image now (symphony-jre).
d /storage/.kodi/userdata/addon_data/tools.jre.zulu 0755 root root - -
